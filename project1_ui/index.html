<!doctype html>
<html lang="en">

<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>PROJECT-1</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111;
    color: #eee;
    font-family: Arial, sans-serif;
}

#app {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
}

#topbar {
    height: 58px;
    flex: 0 0 58px;

    display: flex;
    align-items: center;

    gap: 16px;

    padding: 0 18px;

    background: #181818;

    border-bottom: 1px solid #333;
}

.logo {
    font-size: 19px;
    font-weight: 700;
    letter-spacing: .5px;
}

.status {
    display: flex;
    align-items: center;
    gap: 7px;

    color: #aaa;
    font-size: 13px;
}

.dot {
    width: 9px;
    height: 9px;

    border-radius: 50%;

    background: #35c759;
}

#main {
    min-height: 0;
    flex: 1;

    display: flex;
}

#browser {
    min-width: 0;
    flex: 1;

    background: #000;
}

#browser iframe {
    width: 100%;
    height: 100%;

    border: 0;
}

#side {
    width: 310px;
    flex: 0 0 310px;

    padding: 18px;

    display: flex;
    flex-direction: column;

    gap: 14px;

    background: #181818;

    border-left: 1px solid #333;
}

h2 {
    margin: 0;
    font-size: 17px;
}

p {
    margin: 0;

    color: #aaa;

    font-size: 13px;
    line-height: 1.45;
}

label {
    color: #aaa;
    font-size: 12px;
}

textarea {
    width: 100%;
    min-height: 110px;

    resize: vertical;

    padding: 10px;

    background: #101010;
    color: #eee;

    border: 1px solid #444;
    border-radius: 8px;

    outline: none;
}

button {
    padding: 10px 13px;

    border: 0;
    border-radius: 8px;

    background: #2f7df6;
    color: white;

    cursor: pointer;

    font-weight: 600;
}

button:hover {
    background: #4b8cf7;
}

button.secondary {
    background: #303030;
}

#info {
    margin-top: auto;

    padding-top: 14px;

    border-top: 1px solid #333;

    color: #777;

    font-size: 11px;
    line-height: 1.5;
}

</style>
</head>

<body>

<div id="app">

<div id="topbar">

<div class="logo">
PROJECT-1
</div>

<div class="status">
<div class="dot"></div>
<span>Virtual Browser</span>
</div>

<div class="status">
<span>Chromium</span>
</div>

<div class="status">
<span>ChatGPT</span>
</div>

</div>

<div id="main">

<div id="browser">

<iframe
id="browserFrame"
src="/vnc/vnc.html?autoconnect=true&resize=scale&view_only=false&reconnect=true"
allow="clipboard-read; clipboard-write">
</iframe>

</div>

<aside id="side">

<h2>PROJECT-1</h2>

<p>
Это рабочее окно браузера PROJECT-1.
Авторизация выполняется непосредственно
в Chromium.
</p>

<button onclick="focusBrowser()">
Фокус браузера
</button>

<button
class="secondary"
onclick="reloadBrowser()">
Перезагрузить браузер
</button>

<label>
Команда PROJECT-1
</label>

<textarea
id="command"
placeholder="Команда для PROJECT-1...">
</textarea>

<button onclick="sendCommand()">
Выполнить
</button>

<div id="info">

Логин и пароль не передаются
в Python или relay.

Пользователь вводит их
непосредственно в браузере.

</div>

</aside>

</div>

</div>

<script>

function focusBrowser() {

    document
        .getElementById("browserFrame")
        .focus();

}

function reloadBrowser() {

    const frame =
        document.getElementById("browserFrame");

    frame.src =
        "/vnc/vnc.html" +
        "?autoconnect=true" +
        "&resize=scale" +
        "&view_only=false" +
        "&reconnect=true";

}

function sendCommand() {

    const command =
        document
        .getElementById("command")
        .value
        .trim();

    if (!command) {
        return;
    }

    console.log(
        "[PROJECT-1]",
        command
    );

    alert(
        "Команда получена.\n\n" +
        "Следующий этап — подключение " +
        "команд PROJECT-1 к браузеру."
    );

}

</script>

</body>

</html>
